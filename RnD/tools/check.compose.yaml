# Gate container for tools/check.sh: the `rnd` service (same mounts as compose.yaml) on the hackeye-rnd-check image
# (hackeye-rnd + pinned ruff and mypy, tools/check.Dockerfile). The Lab image is untouched.
services:
  check:
    extends:
      file: ../compose.yaml
      service: rnd
    image: hackeye-rnd-check
    build:
      context: ..
      dockerfile: tools/check.Dockerfile
    entrypoint: ["bash"]
    # Absolute host paths: compose.yaml's relative ../../../media and ../../../models resolve one level off when RnD/ lives in
    # a git worktree (.worktrees/<name>/RnD), which mounted empty, root-owned stand-ins and skipped the media tests.
    volumes:
      - ${HACKEYE_MEDIA_HOST_DIR:-${HOME}/media/hackeye}:/media:ro
      - ${HACKEYE_BASE_MODELS_DIR:-${HOME}/models}:/base-models:ro
    deploy: {}
