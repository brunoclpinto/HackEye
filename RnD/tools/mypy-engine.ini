# mypy --strict for the v26.3.0 packages. Legacy flat modules are not followed (so `import collision` in a facade
# test is Any); third-party packages without stubs are ignored. Used by tools/check.sh.
[mypy]
python_version = 3.11
strict = True
mypy_path = src:.:tools
explicit_package_bases = True
namespace_packages = True
cache_dir = /tmp/mypy-cache-hackeye

[mypy-collision.*,groundfuse,geometry,worldmap,worldtracks,faceedge,sensors,common_paths,egoflow,depth,segmentation,models,letterbox,config,profiles,gpu_guard,detect,track,overlay,pipeline,debug_output,replay,lab.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-scipy.*,cv2.*,torch.*,ultralytics.*,onnxruntime.*,timm.*,transformers.*,huggingface_hub.*,safetensors.*,omegaconf.*,einops.*,depth_anything_3.*,unidepth.*,fastapi.*,uvicorn.*]
ignore_missing_imports = True
