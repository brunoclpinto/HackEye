# Strict lint/format config for the v26.3.0 packages (src/engine, tests/engine, the boundary/equivalence tests/tools,
# later lab/{store,jobs,stages,api}). Used by tools/check.sh only; the legacy code is not held to this.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "TC", "PL"]
ignore = [
    "PLR0913",  # too many arguments: the ported signatures are what they are
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR0911",  # too many returns
    "PLR2004",  # magic values (physics constants live in the code as in the legacy modules)
    "PLC0415",  # import outside top level (red tests import engine.<model> inside test functions)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode in strings / docstrings / comments
    "PLW2901",  # loop variable overwritten
    "SIM108",   # ternary instead of if/else
]

[lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "B011", "S101"]
"**/test_*.py" = ["PLR2004"]

[lint.isort]
known-first-party = ["engine", "lab", "tests"]

[format]
quote-style = "double"
