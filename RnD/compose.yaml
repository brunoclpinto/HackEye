services:
  rnd:
    build: .
    image: hackeye-rnd
    working_dir: /rnd
    # Run as the host user, not root — otherwise every file this writes to
    # the bind-mounted debug/models/media/common dirs (there will be
    # thousands, once real runs start) ends up root-owned and needs sudo to
    # clean up. Override with `UID=$(id -u) GID=$(id -g) docker compose ...`
    # if your host user isn't uid/gid 1000.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/rnd
      - ../media:/media:ro
      - ../models:/models
      - ../debug:/debug
      - ../common:/common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Also settable via `docker compose run --gpus all`. The reservation above
    # is the durable form so plain `docker compose run rnd ...` gets the GPU
    # without remembering the flag every time.
